services:
  app:
    build: .
    command: sleep infinity
    volumes:
      - .:/workspace:cached
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: certregistry
      POSTGRES_USER: certregistry
      POSTGRES_PASSWORD: certregistry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certregistry"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
